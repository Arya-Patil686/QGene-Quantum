# Fly.io deployment. The app loads its model bundles at import and sits at
# roughly 150 MB resident, so a 512 MB machine is comfortable.
app = "qgene"
primary_region = "bom"

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
