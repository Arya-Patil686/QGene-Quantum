services:
  - type: web
    name: qgene
    runtime: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      cd web && npm install && npm run build
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 20.11.0
